<!doctype html>
<!--
  The link-preview card (public/og.png). To regenerate after content changes:
    npm run dev, then
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=6000 \
      --screenshot=public/og.png http://localhost:5173/scripts/og-card.html
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #09090b; }
  body { font-family: "Geist Variable", system-ui, sans-serif; color: #ececf1; position: relative; }
  .grid { position: absolute; inset: 0; background: radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1px, transparent 0) 0 0 / 28px 28px; }
  .glow { position: absolute; right: -120px; top: -160px; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle, rgba(250,204,21,.16), transparent 65%); }
  .wrap { position: absolute; inset: 72px 80px; display: flex; flex-direction: column; }
  .tile { width: 96px; height: 96px; border-radius: 28px; margin-top: 8px; background: linear-gradient(140deg,#fde047,#facc15 45%,#fb923c); display: grid; place-items: center; overflow: hidden; }
  .tile svg { width: 96px; height: 96px; }
  .name { margin-top: 34px; font-size: 92px; line-height: 1; font-weight: 650; letter-spacing: -.045em; }
  .role { margin-top: 20px; font-size: 30px; color: #c4c4cc; }
  .builds { margin-top: 14px; font: 22px "Geist Mono Variable", monospace; color: #facc15; }
  .foot { margin-top: auto; display: flex; gap: 28px; font: 20px "Geist Mono Variable", monospace; color: #8a8a96; }
  .foot b { color: #ececf1; font-weight: 500; }
  .dot { color: #4ade80; }
  .og-vink { position: absolute; right: 64px; bottom: 30px; width: 215px; }
  .og-vink svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="wrap">
    <div class="tile" id="head"></div>
    <div class="name">Navin Kumar</div>
    <div class="role">AI Software Engineer at CloudxLab, building Terno AI</div>
    <div class="builds">AI agents · MCP servers · RAG memory · evals · text-to-SQL</div>
    <div class="foot"><span><b>navinbhagat322.github.io</b></span><span><span class="dot">●</span> open to AI engineering roles</span></div>
  </div>
  <div class="og-vink" id="vink"></div>
  <script type="module">
    import "@fontsource-variable/geist";
    import "@fontsource-variable/geist-mono";
    import "/src/style.css";
    import { vinkSVG } from "/src/vink.ts";
    document.getElementById("head").innerHTML = vinkSVG("head");
    document.getElementById("vink").innerHTML = vinkSVG("full");
    await document.fonts.ready;
    document.body.dataset.ready = "1";
  </script>
</body>
</html>
